---
layout: default
title: Contact Us
---

<section class="contact-hero">
  <h1>Contact Us</h1>
  <p>Fill out the form below to get in touch. We'll respond shortly!</p>
</section>

<section class="contact-form-section">
  <form class="contact-form" id="contactForm" action="https://formspree.io/f/xgobgbql" method="POST">

    <div class="form-group">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" placeholder="Your email address" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Your message" rows="6"></textarea>
    </div>

    <button type="submit">Send Message</button>
    <p class="contact-error" id="contactError" style="display:none; color:#c0392b; margin-top:0.75rem;">
      Something went wrong sending your message. Please try again, or email us directly.
    </p>

  </form>
</section>

<script>
  document.getElementById('contactForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.target;
    const errorMsg = document.getElementById('contactError');
    errorMsg.style.display = 'none';

    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        window.location.href = '/thanks';
      } else {
        errorMsg.style.display = 'block';
      }
    } catch (err) {
      errorMsg.style.display = 'block';
    }
  });
</script>
