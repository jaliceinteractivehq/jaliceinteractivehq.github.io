---
layout: default
title: Contact Us
---

<section class="contact-hero">
  <h1>Contact Us</h1>
  <p>Fill out the form below to get in touch. We'll respond shortly!</p>
</section>

<section class="contact-form-section">
  <form class="contact-form" action="https://formspree.io/f/xgobgbql" method="POST" data-next="/thanks">
    
    <div class="form-group">
      <label for="name">Name *</label>
      <input type="text" id="name" name="name" placeholder="Your name" required>
    </div>

    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" placeholder="Your email address" required>
    </div>

    <div class="form-group">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Your message" rows="6"></textarea>
    </div>

    <input type="hidden" name="_next" value="https://jaliceinteractivehq.github.io/thanks">
    <button type="submit">Send Message</button>

  </form>
</section>
