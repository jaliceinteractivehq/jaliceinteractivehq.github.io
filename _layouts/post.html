---
layout: default
---

<article class="post-detail">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-date">{{ page.date | date: "%b %d, %Y" }}</p>
  </header>
  <div class="post-body">
    {% if page.image %}
      <div class="post-image">
        <img src="{{ page.image }}" alt="{{ page.title }}">
      </div>
    {% endif %}
    <div class="post-content">
      {{ content }}
    </div>
  </div>
  <div class="post-back">
    <a href="/blog">← Back to Blog</a>
  </div>
</article>
