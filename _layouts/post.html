---
layout: default
---

<article class="post-detail">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <p class="post-date">{{ page.date | date: "%b %d, %Y" }}</p>
    </header>
    <div class="post-body">
        {% if page.image %}
        <div class="post-image">
            <img src="{{ page.image }}" alt="{{ page.title }}">
        </div>
        {% endif %}
        <div class="post-content">
            {{ content }}
        </div>
    </div>
    <div class="post-nav">
        {% if page.previous.url %}
        <a href="{{ page.previous.url }}" class="post-nav-btn">
            ← {{ page.previous.title }}
        </a>
        {% else %}
        <span></span>
        {% endif %}

        {% if page.next.url %}
        <a href="{{ page.next.url }}" class="post-nav-btn">
            {{ page.next.title }} →
        </a>
        {% endif %}
    </div>
    <div class="post-back">
        <a href="/blog">← Back to Blog</a>
    </div>
</article>
