---
layout: default
title: Blog
---

<section class="blog-section">
  <h1>Blog</h1>
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <a href="{{ post.url }}">{{ post.title }}</a>
        <p class="post-date">{{ post.date | date: "%b %d, %Y" }}</p>
        {% if post.excerpt %}
          <p class="post-excerpt">{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
</section>
